<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1e33">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="츄테크">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>츄테크</title>
</head>
<body>
  <header class="top" id="top">
    <div class="top-in">
      <div>
        <h1 id="top-title">츄테크</h1>
        <small id="top-sub">TQQQ와 SGOV, 섀넌의 도깨비</small>
      </div>
      <button type="button" class="mode-btn" id="mode-btn" data-act="mode-toggle" aria-pressed="false">모의거래</button>
    </div>
  </header>

  <main id="app" aria-live="polite"></main>

  <nav class="tabs" id="tabs" aria-label="메뉴">
    <div class="tabs-in" role="tablist">
      <button class="tab" role="tab" data-tab="today">오늘</button>
      <button class="tab" role="tab" data-tab="hold">보유</button>
      <button class="tab" role="tab" data-tab="log">기록</button>
      <button class="tab" role="tab" data-tab="set">설정</button>
    </div>
  </nav>

  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
